name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests and package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Test
        run: python -B -m unittest discover -s tests
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c 'import os; from codex_dashboard import __version__; assert os.environ["GITHUB_REF_NAME"] == "v" + __version__, "Tag must match package version"'
          git merge-base --is-ancestor HEAD origin/main
      - name: Build wheel and Homebrew archive
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install build
          python -m build --wheel
          python scripts/build_homebrew.py --wheel dist/*.whl --repository "$RELEASE_REPOSITORY"
      - name: Test installed package outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/tyrell-smoke"
          "$RUNNER_TEMP/tyrell-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/tyrell-smoke/bin/tyrell" --version
          "$RUNNER_TEMP/tyrell-smoke/bin/tyrell" --help
      - name: Test Homebrew installer
        env:
          HOMEBREW_DEVELOPER: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          brew list python@3.14 >/dev/null 2>&1 || brew install python@3.14
          brew ruby scripts/verify_homebrew.rb "$PWD/dist/homebrew/repository-files/Formula/agent-hub.rb" "$PWD"/dist/homebrew/*-homebrew.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            dist/*.whl
            dist/homebrew/
          retention-days: 14

  release:
    name: Draft release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Create draft with tested packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft \
            dist/*.whl dist/homebrew/*-homebrew.tar.gz dist/homebrew/SHA256SUMS \
            dist/homebrew/repository-files/Formula/agent-hub.rb
