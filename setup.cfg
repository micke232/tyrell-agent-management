[metadata]
name = agent-hub-management
version = attr: codex_dashboard.__version__
description = Tyrell Agent Management - A local terminal hub for Codex and GitHub Copilot agents
long_description = file: docs/install.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console :: Curses
    Operating System :: MacOS
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3

[options]
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
include = codex_dashboard

[options.package_data]
codex_dashboard = demo.json

[options.entry_points]
console_scripts =
    tyrell = codex_dashboard.cli:main
    agent-hub = codex_dashboard.cli:main
