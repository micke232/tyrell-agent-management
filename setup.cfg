[metadata]
name = tyrell-agent-management
version = attr: tyrell.__version__
description = Tyrell Agent Management - A local terminal hub for Codex and GitHub Copilot agents
long_description = file: docs/install.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console :: Curses
    Operating System :: MacOS
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3

[options]
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
include = tyrell

[options.package_data]
tyrell = demo.json

[options.entry_points]
console_scripts =
    tyrell = tyrell.cli:main
    agent-hub = tyrell.cli:main
